# The workflow pins the default image to a version when attaching this file to a release.
# Use the same project directory for future updates to retain the same named volume.
services:
  vorum:
    image: ${VORUM_IMAGE:-ghcr.io/sebastianhe/vorum:latest}
    ports:
      - "${VORUM_BIND:-127.0.0.1}:${VORUM_PORT:-8000}:8000"
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      - vorum-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  notification-worker:
    image: ${VORUM_IMAGE:-ghcr.io/sebastianhe/vorum:latest}
    command: ["flask", "--app", "vorum", "notification-worker"]
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      - vorum-data:/app/data
    depends_on:
      vorum:
        condition: service_healthy
    restart: unless-stopped
volumes:
  vorum-data:
